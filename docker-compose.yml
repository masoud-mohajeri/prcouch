# Local Langfuse v4 deployment. Service credentials belong in .langfuse.env,
# which is intentionally ignored by git.
name: prcouch-langfuse

x-langfuse-common: &langfuse-common
  env_file: ${LANGFUSE_ENV_FILE:-.langfuse.env}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  langfuse-web:
    <<: *langfuse-common
    image: docker.langfuse.com/langfuse/langfuse:4
    ports:
      - "4000:3000"
    environment:
      # This Compose setup uses a single ClickHouse node, not a cluster with
      # ZooKeeper/ClickHouse Keeper.
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090

  langfuse-worker:
    <<: *langfuse-common
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    environment:
      CLICKHOUSE_CLUSTER_ENABLED: "false"
    ports:
      - "127.0.0.1:3030:3030"

  postgres:
    image: docker.io/postgres:17
    env_file: ${LANGFUSE_ENV_FILE:-.langfuse.env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    user: "101:101"
    env_file: ${LANGFUSE_ENV_FILE:-.langfuse.env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  redis:
    image: docker.io/redis:7
    env_file: ${LANGFUSE_ENV_FILE:-.langfuse.env}
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        'redis-server --requirepass "$$REDIS_AUTH" --maxmemory-policy noeviction',
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_AUTH" ping']
      interval: 3s
      timeout: 10s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    env_file: ${LANGFUSE_ENV_FILE:-.langfuse.env}
    restart: unless-stopped
    ports:
      - "9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:
